<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Portf&oacute;lio - Eduardo Silva</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="empty-page">
    <header class="topbar">
      <nav class="topbar__links" aria-label="Navegação principal">
        <a href="index.html">
          <span>Início</span>
        </a>
        <a href="experiencias.html" aria-current="page">
          <span>Portfólio</span>
        </a>
        <a class="topbar__whatsapp" href="https://wa.me/5511978472679" aria-label="Abrir conversa no WhatsApp">
          <span>Contato</span>
        </a>
      </nav>
    </header>
    <svg class="glass-filter" aria-hidden="true" focusable="false">
      <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
        <feTurbulence type="fractalNoise" baseFrequency="0.001 0.005" numOctaves="1" seed="17" result="turbulence" />
        <feGaussianBlur in="turbulence" stdDeviation="3" result="softMap" />
        <feDisplacementMap in="SourceGraphic" in2="softMap" scale="20" xChannelSelector="R" yChannelSelector="G" />
      </filter>
        </svg>
    <main class="portfolio-page" id="portfolio" aria-label="Portfólio">
      <p class="portfolio-page__eyebrow">Portfólio</p>

      <section class="portfolio-grid" aria-label="Projetos selecionados">
        <article class="portfolio-card portfolio-card--pirania">
          <img src="assets/images/pirania-card.png" alt="Remasterização do site Pirania" />
          <a class="portfolio-card__button" href="projeto-pirania.html" aria-label="Abrir projeto Remasterização do site Pirania">
            <span>Remasterização do site Pirania</span>
            <span>Ver projeto ↗</span>
          </a>
        </article>

        <article class="portfolio-card portfolio-card--acervo">
          <img src="assets/images/acervo-vivo-card.png" alt="Coordenação da plataforma Acervo Vivo" />
          <a class="portfolio-card__button" href="projeto-acervo-vivo.html" aria-label="Abrir projeto Plataforma Acervo Vivo">
            <span>Plataforma Acervo Vivo</span>
            <span>Ver projeto ↗</span>
          </a>
        </article>

        <article class="portfolio-card portfolio-card--notae">
          <img src="assets/images/notae-card.png" alt="Criação do Notaê, sistema para escolas" />
          <a class="portfolio-card__button" href="projeto-notae.html" aria-label="Abrir projeto Notaê, sistema para escolas">
            <span>Notaê: sistema para escolas</span>
            <span>Ver projeto ↗</span>
          </a>
        </article>

      </section>
    </main>

    <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script defer src="js/script.js"></script>
  </body>
</html>
