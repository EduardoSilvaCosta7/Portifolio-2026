<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Contato - Eduardo Silva</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="empty-page">
    <header class="topbar">
      <a class="topbar__brand" href="index.html" aria-label="Eduardo Silva, início">Eduardo<br>Silva</a>
      <nav class="topbar__links" aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="experiencias.html">Portfólio</a>
      </nav>
      <a class="topbar__contact" href="contato.html" aria-current="page">Contato</a>
      <button class="topbar__toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Abrir menu">
        <i data-lucide="menu" aria-hidden="true"></i>
      </button>
      <nav class="topbar__mobile-menu" id="mobile-menu" aria-label="Menu mobile">
        <a href="index.html">Início</a>
        <a href="experiencias.html">Portfólio</a>
        <a class="topbar__mobile-contact" href="contato.html" aria-current="page">Contato</a>
      </nav>
    </header>
    <svg class="glass-filter" aria-hidden="true" focusable="false">
      <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
        <feTurbulence type="fractalNoise" baseFrequency="0.001 0.005" numOctaves="1" seed="17" result="turbulence" />
        <feGaussianBlur in="turbulence" stdDeviation="3" result="softMap" />
        <feDisplacementMap in="SourceGraphic" in2="softMap" scale="20" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <main class="contact-section" id="home" aria-label="Contato">
      <div class="contact-inner">
        <p class="contact-kicker">Contato</p>
        <h2>Vamos conversar?</h2>

        <div class="contact-links">
          <a class="contact-link" href="https://www.instagram.com/eduardoscosta7/" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
            <span>Instagram</span>
          </a>
          <a class="contact-link" href="mailto:eduardosilcos@gmail.com" data-email-trigger aria-label="Email">
            <span>Email</span>
          </a>
          <a class="contact-link" href="https://github.com/eeduardosilvacosta6-sketch" aria-label="GitHub" target="_blank" rel="noopener noreferrer">
            <span>GitHub</span>
          </a>
        </div>
      </div>
    </main>

    <div class="email-modal" data-email-modal aria-hidden="true">
      <div class="email-modal__panel" role="dialog" aria-modal="true" aria-labelledby="email-modal-title">
        <button class="email-modal__close" type="button" data-email-close aria-label="Fechar">x</button>
        <p class="email-modal__kicker">Email</p>
        <h2 id="email-modal-title">Copie meu email</h2>
        <p class="email-modal__address">eduardosilcos@gmail.com</p>
        <button class="email-modal__copy" type="button" data-email-copy>Copiar</button>
      </div>
    </div>

    <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script defer src="js/script.js"></script>
  </body>
</html>
